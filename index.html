<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leo — Creating Content That Connects</title>
<style>
  :root{
    --bg:#070709;--blue:#2E9BFF;--cyan:#22D3EE;--violet:#7C5CFF;--red:#FF5C4D;
    --card:#111114;--line:rgba(46,155,255,.22);--muted:#9a9aa4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:#fff;line-height:1.55;position:relative;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none;
    background:radial-gradient(circle at 50% 0%,#0d1424 0%,#070709 60%)}
  .aurora{position:absolute;border-radius:50%;filter:blur(100px)}
  .a1{width:560px;height:560px;background:var(--blue);opacity:.30;top:-140px;left:-160px;animation:d1 20s ease-in-out infinite}
  .a2{width:480px;height:480px;background:var(--red);opacity:.16;bottom:-160px;right:-140px;animation:d2 26s ease-in-out infinite}
  .a3{width:420px;height:420px;background:var(--violet);opacity:.18;top:40%;left:52%;animation:d3 30s ease-in-out infinite}
  .a4{width:360px;height:360px;background:var(--cyan);opacity:.14;top:60%;left:-80px;animation:d2 24s ease-in-out infinite}
  @keyframes d1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(150px,120px) scale(1.15)}}
  @keyframes d2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-130px,-90px) scale(1.2)}}
  @keyframes d3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-160px,90px) scale(.9)}}
  .grid-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.30;
    background-image:linear-gradient(rgba(46,155,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(46,155,255,.10) 1px,transparent 1px);
    background-size:56px 56px;animation:gm 24s linear infinite;
    mask-image:radial-gradient(circle at 50% 25%,#000 5%,transparent 75%);
    -webkit-mask-image:radial-gradient(circle at 50% 25%,#000 5%,transparent 75%)}
  @keyframes gm{from{background-position:0 0}to{background-position:56px 56px}}
  .particles{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
  .particles span{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--blue);opacity:.5;animation:rise linear infinite}
  @keyframes rise{to{transform:translateY(-105vh);opacity:0}}
  .wrap{max-width:1100px;margin:0 auto;padding:24px;position:relative}
  .hero{text-align:center;padding:60px 24px;margin-bottom:56px;border-radius:18px;
    background:rgba(9,9,12,.5);backdrop-filter:blur(8px);border:1px solid transparent;position:relative;animation:fadeUp .8s ease both;background-clip:padding-box}
  .hero::before{content:"";position:absolute;inset:0;border-radius:18px;padding:1px;
    background:linear-gradient(120deg,var(--blue),var(--violet),var(--red),var(--blue));background-size:300% 300%;animation:borderflow 8s linear infinite;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  @keyframes borderflow{to{background-position:300% 0}}
  .pfp{width:118px;height:118px;border-radius:50%;object-fit:cover;border:3px solid var(--blue);margin-bottom:18px;animation:glow 3.5s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(46,155,255,.45)}50%{box-shadow:0 0 40px 8px rgba(46,155,255,.30)}}
  .hero h1{font-size:2.6rem;font-weight:800;letter-spacing:-.5px;margin-bottom:8px;
    background:linear-gradient(90deg,#fff,var(--cyan),var(--blue),#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}
  @keyframes shine{to{background-position:200% center}}
  .role{color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:3px;font-size:.82rem;margin-bottom:16px}
  .bio{color:#d7d7de;max-width:540px;margin:0 auto 24px;font-size:1.08rem;font-weight:500}
  .socials{display:flex;gap:14px;justify-content:center;margin-bottom:26px;flex-wrap:wrap;position:relative;z-index:2}
  .socials a{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);color:#cfd0d6;background:rgba(255,255,255,.03);transition:.25s}
  .socials a:hover{transform:translateY(-4px);border-color:var(--blue);color:var(--blue);box-shadow:0 8px 22px rgba(46,155,255,.28)}
  .socials svg{width:20px;height:20px;fill:currentColor}
  .cta-wrap{margin-top:8px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative;z-index:2}
  .cta{display:inline-flex;align-items:center;gap:10px;position:relative;overflow:hidden;white-space:nowrap;
    background:linear-gradient(90deg,var(--blue),var(--cyan));color:#04121f;font-weight:800;padding:16px 40px;border-radius:10px;text-decoration:none;font-size:1.05rem;transition:.25s;box-shadow:0 10px 30px rgba(46,155,255,.28)}
  .cta:hover{transform:translateY(-3px);box-shadow:0 14px 38px rgba(46,155,255,.45)}
  .cta.ghost{background:transparent;color:#fff;border:1px solid var(--line);box-shadow:none}
  .cta.ghost:hover{border-color:var(--blue);color:var(--blue)}
  .cta::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:sweep 3.2s ease-in-out infinite}
  .cta.ghost::after{display:none}
  @keyframes sweep{0%{left:-120%}55%,100%{left:160%}}
  .section{margin-bottom:56px;animation:fadeUp .9s ease both}
  .section h2{font-size:1.4rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:22px;padding-bottom:12px;position:relative}
  .section h2::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:3px;background:linear-gradient(90deg,var(--red),var(--blue),transparent)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(min-width:720px){
    .grid{grid-template-columns:repeat(4,minmax(0,200px));justify-content:center;gap:18px}
  }
  .card{background:rgba(17,17,20,.7);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .3s,border-color .3s,box-shadow .3s}
  .card:hover{transform:translateY(-6px);border-color:var(--blue);box-shadow:0 14px 36px rgba(46,155,255,.25)}
  .card video{width:100%;display:block;background:#000;aspect-ratio:9/16;object-fit:cover}
  .card .meta{padding:11px 14px}
  .card .meta h3{font-size:.92rem;color:var(--blue);letter-spacing:.4px}
  footer{text-align:center;padding:50px 24px;border-top:1px solid var(--line);color:var(--muted)}
  footer a{color:var(--blue);text-decoration:none;font-weight:700}
  @keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:600px){.hero h1{font-size:2rem}.bio{font-size:1rem}.section h2{font-size:1.2rem}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<script>

    const tries=['profile.jpg','profile.jpeg','profile.png','profile.JPG','profile.JPEG','profile.PNG','profile.webp'];
